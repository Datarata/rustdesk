name: SavolDesk Windows x64

on:
  workflow_dispatch:
    inputs:
      include_raw_build:
        description: 'Attach the unpacked diagnostic build in addition to the installer'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Если нажать Run несколько раз, предыдущая незавершённая сборка
# этой же ветки будет отменена.
concurrency:
  group: savoldesk-windows-x64-${{ github.ref }}
  cancel-in-progress: true

env:
  # ------------------------------------------------------------
  # SAVOL BUILD
  # ------------------------------------------------------------

  SOURCE_REF: "savol-1.4.9"
  VERSION: "1.4.9"

  # ------------------------------------------------------------
  # RUSTDESK 1.4.9 TOOLCHAIN
  # ------------------------------------------------------------

  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"

  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"

  # RustDesk 1.4.9 / vcpkg 2025.08.27.
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"

  # GitHub Actions binary cache для vcpkg.
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"


jobs:

  # ============================================================
  # 1. GENERATE FLUTTER <-> RUST BRIDGE
  # ============================================================

  generate-bridge:
    name: Generate Flutter/Rust bridge

    runs-on: ubuntu-22.04

    timeout-minutes: 30

    steps:

      # --------------------------------------------------------
      # Checkout именно нашей ветки.
      #
      # Это принципиально:
      # workflow никогда не должен случайно собирать master.
      # --------------------------------------------------------

      - name: Checkout SavolDesk 1.4.9
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: savol-1.4.9
          submodules: recursive
          fetch-depth: 1


      # --------------------------------------------------------
      # Показываем, что реально получили нужную ревизию.
      # --------------------------------------------------------

      - name: Verify source revision
        shell: bash
        run: |
          set -e

          echo "============================================"
          echo " Git branch"
          echo "============================================"

          git branch --show-current

          echo
          echo "============================================"
          echo " Git commit"
          echo "============================================"

          git rev-parse HEAD
          git log -1 --oneline

          echo
          echo "============================================"
          echo " vcpkg baseline"
          echo "============================================"

          grep '"baseline"' vcpkg.json


      - name: Verify privileged password provisioning patch
        shell: bash
        run: |
          set -e

          grep -F '#[cfg(not(windows))]' src/core_main.rs
          grep -F 'let result = crate::ipc::provision_permanent_password' src/core_main.rs
          grep -F 'Data::ProvisionPermanentPassword(password)' src/ipc.rs
          grep -F 'stream.is_privileged_password_provisioning_peer()' src/ipc.rs
          grep -F 'fn provision_permanent_password_storage' src/ipc.rs
          grep -F 'Config::set_permanent_password_storage_for_sync' src/ipc.rs
          grep -F 'Password provisioning service IPC unavailable' src/ipc.rs
          grep -F 'ipc::Data::ProvisionPermanentPassword(password)' src/platform/windows.rs
          grep -F 'stream.is_privileged_password_provisioning_peer()' src/platform/windows.rs
          grep -F 'test_windows_password_provisioning_requires_privileged_peer' src/ipc/auth.rs

          echo "Privileged password provisioning patch OK."


      # --------------------------------------------------------
      # Системные зависимости bridge generator.
      # --------------------------------------------------------

      - name: Install prerequisites
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            ca-certificates \
            clang \
            cmake \
            curl \
            gcc \
            g++ \
            git \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget


      # --------------------------------------------------------
      # Rust 1.75 — тот же toolchain, что у RustDesk 1.4.9.
      # --------------------------------------------------------

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.75"
          targets: x86_64-unknown-linux-gnu
          components: rustfmt


      # --------------------------------------------------------
      # Кэш cargo.
      # --------------------------------------------------------

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: savol-bridge-ubuntu-22.04


      # --------------------------------------------------------
      # Flutter 3.22.3 используется именно для генерации
      # bridge в стандартной x64 ветке RustDesk 1.4.9.
      # --------------------------------------------------------

      - name: Install Flutter for bridge
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.22.3"
          cache: true


      # --------------------------------------------------------
      # flutter_rust_bridge_codegen.
      # --------------------------------------------------------

      - name: Install Flutter Rust bridge tools
        shell: bash
        run: |
          set -e

          cargo install \
            cargo-expand \
            --version "${CARGO_EXPAND_VERSION}" \
            --locked

          cargo install \
            flutter_rust_bridge_codegen \
            --version "${FLUTTER_RUST_BRIDGE_VERSION}" \
            --features uuid \
            --locked


      # --------------------------------------------------------
      # RustDesk 1.4.9 официально делает downgrade extended_text
      # при bridge generation на Flutter 3.22.3.
      # --------------------------------------------------------

      - name: Prepare Flutter dependencies
        shell: bash
        run: |
          set -e

          sed -i \
            -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' \
            flutter/pubspec.yaml

          pushd flutter

          flutter pub get

          popd


      # --------------------------------------------------------
      # Генерируем Rust <-> Dart bridge.
      # --------------------------------------------------------

      - name: Generate Flutter Rust bridge
        shell: bash
        run: |
          set -e

          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/bridge_generated.h


      # --------------------------------------------------------
      # Передаём bridge Windows job.
      # --------------------------------------------------------

      - name: Upload bridge artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: savol-bridge-artifact
          retention-days: 1
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart


  # ============================================================
  # 2. BUILD RustDeskTempTopMostWindow x64
  # ============================================================

  build-topmost-x64:
    name: Build TopMost helper x64

    runs-on: windows-2022

    timeout-minutes: 15

    steps:

      # --------------------------------------------------------
      # MSBuild.
      # --------------------------------------------------------

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce


      # --------------------------------------------------------
      # Этот helper является частью официальной Windows сборки
      # RustDesk.
      # --------------------------------------------------------

      - name: Clone RustDeskTempTopMostWindow
        shell: powershell
        run: |
          git clone `
            https://github.com/rustdesk-org/RustDeskTempTopMostWindow `
            RustDeskTempTopMostWindow


      # --------------------------------------------------------
      # Фиксируем тот же commit, что официальный RustDesk 1.4.9.
      # --------------------------------------------------------

      - name: Build RustDeskTempTopMostWindow
        shell: powershell
        run: |
          Set-Location RustDeskTempTopMostWindow

          git checkout `
            ecd8d6a139eee76845ea66423fb739af450fda90

          msbuild `
            WindowInjection/WindowInjection.vcxproj `
            -p:Configuration=Release `
            -p:Platform=x64 `
            /p:TargetVersion=Windows10


      # --------------------------------------------------------
      # Передаём DLL основной Windows сборке.
      # --------------------------------------------------------

      - name: Upload TopMost helper
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: savol-topmostwindow-x64
          retention-days: 1
          path: |
            ./RustDeskTempTopMostWindow/WindowInjection/x64/Release/WindowInjection.dll


  # ============================================================
  # 3. BUILD RUSTDESK WINDOWS x64
  # ============================================================

  build-windows-x64:
    name: Build SavolDesk Windows x64

    needs:
      - generate-bridge
      - build-topmost-x64

    runs-on: windows-2022

    timeout-minutes: 90

    steps:

      # --------------------------------------------------------
      # VCPKG x-gha cache требует эти runtime variables.
      # --------------------------------------------------------

      - name: Export GitHub Actions cache environment
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        with:
          script: |
            core.exportVariable(
              'ACTIONS_CACHE_URL',
              process.env.ACTIONS_CACHE_URL || ''
            );

            core.exportVariable(
              'ACTIONS_RUNTIME_TOKEN',
              process.env.ACTIONS_RUNTIME_TOKEN || ''
            );


      # --------------------------------------------------------
      # КРИТИЧЕСКИ ВАЖНО:
      #
      # checkout всегда идёт именно из savol-1.4.9.
      #
      # Поэтому даже если workflow случайно запустить из master,
      # BUILD исходники всё равно будут savol-1.4.9.
      # --------------------------------------------------------

      - name: Checkout SavolDesk 1.4.9
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: savol-1.4.9
          submodules: recursive
          fetch-depth: 1


      # --------------------------------------------------------
      # Диагностика checkout.
      # --------------------------------------------------------

      - name: Verify source revision
        shell: powershell
        run: |
          Write-Host "============================================"
          Write-Host " Git branch"
          Write-Host "============================================"

          git branch --show-current

          Write-Host ""
          Write-Host "============================================"
          Write-Host " Git commit"
          Write-Host "============================================"

          git rev-parse HEAD
          git log -1 --oneline

          Write-Host ""
          Write-Host "============================================"
          Write-Host " vcpkg.json"
          Write-Host "============================================"

          Get-Content .\vcpkg.json


      - name: Verify privileged password provisioning patch
        shell: powershell
        run: |
          $Core = Get-Content '.\src\core_main.rs' -Raw
          $Ipc = Get-Content '.\src\ipc.rs' -Raw
          $Auth = Get-Content '.\src\ipc\auth.rs' -Raw
          $Windows = Get-Content '.\src\platform\windows.rs' -Raw

          $Checks = @(
            @($Core, '#[cfg(not(windows))]'),
            @($Core, 'let result = crate::ipc::provision_permanent_password'),
            @($Ipc, 'Data::ProvisionPermanentPassword(password)'),
            @($Ipc, 'stream.is_privileged_password_provisioning_peer()'),
            @($Ipc, 'fn provision_permanent_password_storage'),
            @($Ipc, 'Config::set_permanent_password_storage_for_sync'),
            @($Ipc, 'Password provisioning service IPC unavailable'),
            @($Windows, 'ipc::Data::ProvisionPermanentPassword(password)'),
            @($Windows, 'stream.is_privileged_password_provisioning_peer()'),
            @($Auth, 'test_windows_password_provisioning_requires_privileged_peer')
          )

          foreach ($Check in $Checks) {
            if (-not $Check[0].Contains($Check[1])) {
              throw "Missing provisioning implementation marker: $($Check[1])"
            }
          }

          Write-Host 'Privileged password provisioning patch OK.'


      # --------------------------------------------------------
      # FAIL FAST:
      #
      # Если каким-то образом checkout будет не от RustDesk 1.4.9,
      # сборка остановится здесь, а не спустя 20 минут.
      # --------------------------------------------------------

      - name: Verify RustDesk 1.4.9 vcpkg baseline
        shell: powershell
        run: |
          $Expected = '120deac3062162151622ca4860575a33844ba10b'

          $Manifest = Get-Content `
            '.\vcpkg.json' `
            -Raw |
            ConvertFrom-Json

          $Actual = `
            $Manifest.'vcpkg-configuration'.'default-registry'.baseline

          Write-Host "Expected baseline: $Expected"
          Write-Host "Actual baseline:   $Actual"

          if ($Actual -ne $Expected) {
              throw "Wrong RustDesk source revision: vcpkg baseline mismatch."
          }

          Write-Host "vcpkg baseline OK."


      # --------------------------------------------------------
      # Получаем bridge, созданный первым job.
      # --------------------------------------------------------

      - name: Restore Flutter Rust bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: savol-bridge-artifact
          path: ./


      # --------------------------------------------------------
      # LLVM 15.0.6.
      # --------------------------------------------------------

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: "15.0.6"


      # --------------------------------------------------------
      # Основная Windows Flutter версия RustDesk 1.4.9.
      # --------------------------------------------------------

      - name: Install Flutter 3.24.5
        id: flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          channel: stable
          flutter-version: "3.24.5"
          architecture: x64
          # Сохраняет Flutter SDK и pub cache между hosted-runner builds.
          cache: true


      # --------------------------------------------------------
      # Получаем digest конкретного RustDesk engine asset.
      # Кэш ниже использует digest, поэтому новая версия main
      # автоматически загрузится и не будет подменена старой.
      # --------------------------------------------------------

      - name: Resolve RustDesk engine release
        id: engine_release
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $Headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
          }

          $Release = Invoke-RestMethod `
            -Headers $Headers `
            -Uri 'https://api.github.com/repos/rustdesk/engine/releases/tags/main'

          $Asset = $Release.assets | Where-Object {
            $_.name -eq 'windows-x64-release.zip'
          } | Select-Object -First 1

          if ($null -eq $Asset) {
            throw 'RustDesk Windows x64 engine asset was not found.'
          }

          $Identity = $Asset.digest
          if ([string]::IsNullOrWhiteSpace($Identity)) {
            $Identity = "$($Asset.id)-$($Asset.updated_at)"
          }

          "asset_url=$($Asset.browser_download_url)" >> $env:GITHUB_OUTPUT
          "cache_key=savoldesk-engine-windows-x64-$Identity" >> $env:GITHUB_OUTPUT


      - name: Cache RustDesk Flutter engine archive
        id: engine_cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ./windows-x64-release.zip
          key: ${{ steps.engine_release.outputs.cache_key }}


      # --------------------------------------------------------
      # RustDesk использует собственный patched Flutter engine
      # для Windows x64.
      # --------------------------------------------------------

      - name: Replace Flutter engine with RustDesk engine
        shell: powershell
        env:
          ENGINE_URL: ${{ steps.engine_release.outputs.asset_url }}
        run: |
          flutter doctor -v

          flutter precache --windows

          if ('${{ steps.engine_cache.outputs.cache-hit }}' -ne 'true') {
            Invoke-WebRequest `
              -Uri $env:ENGINE_URL `
              -OutFile "windows-x64-release.zip"
          }

          Expand-Archive `
            -Path "windows-x64-release.zip" `
            -DestinationPath "windows-x64-release"

          $FlutterRoot = "${{ steps.flutter.outputs['CACHE-PATH'] }}"

          Write-Host "Flutter root: $FlutterRoot"

          $Destination = `
            Join-Path `
              $FlutterRoot `
              "bin\cache\artifacts\engine\windows-x64-release"

          Copy-Item `
            -Path ".\windows-x64-release\*" `
            -Destination $Destination `
            -Recurse `
            -Force


      # --------------------------------------------------------
      # Патч Flutter, используемый официальным RustDesk 1.4.9.
      # --------------------------------------------------------

      - name: Patch Flutter
        shell: bash
        run: |
          set -e

          FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"

          cp \
            .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff \
            "${FLUTTER_ROOT}/"

          cd "${FLUTTER_ROOT}"

          patch_file="flutter_3.24.4_dropdown_menu_enableFilter.diff"

          if git apply --check "${patch_file}"; then
            git apply "${patch_file}"
          elif git apply --reverse --check "${patch_file}"; then
            echo "Flutter patch is already present in the restored cache."
          else
            echo "Flutter patch does not match this SDK."
            exit 1
          fi


      # --------------------------------------------------------
      # Rust 1.75 + Windows MSVC x64.
      # --------------------------------------------------------

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.75"
          targets: x86_64-pc-windows-msvc
          components: rustfmt


      # --------------------------------------------------------
      # Rust/Cargo cache.
      # --------------------------------------------------------

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: savoldesk-windows-x64


      # --------------------------------------------------------
      # vcpkg.
      #
      # Commit должен совпадать с baseline из vcpkg.json.
      # --------------------------------------------------------

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: 120deac3062162151622ca4860575a33844ba10b
          doNotCache: false


      # --------------------------------------------------------
      # Устанавливаем зависимости RustDesk.
      #
      # Если vcpkg падает, выводим все build logs.
      # --------------------------------------------------------

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          set -e

          if ! "$VCPKG_ROOT/vcpkg" \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"
          then
            echo
            echo "============================================"
            echo " VCPKG BUILD LOGS"
            echo "============================================"

            find "${VCPKG_ROOT}/" \
              -name "*.log" |
            while read -r log_file
            do
              echo
              echo "===== ${log_file} ====="
              cat "${log_file}"
            done

            exit 1
          fi

          echo
          echo "============================================"
          echo " FFmpeg build log"
          echo "============================================"

          head \
            -n 100 \
            "${VCPKG_ROOT}/buildtrees/ffmpeg/build-x64-windows-static-rel-out.log" \
            || true


      # --------------------------------------------------------
      # Основная компиляция RustDesk.
      #
      # --portable
      # --flutter
      # --hwcodec -> аппаратные кодеки
      # --vram    -> аппаратный GPU/VRAM path
      # --------------------------------------------------------

      - name: Build SavolDesk
        shell: powershell
        run: |
          python3 `
            .\build.py `
            --portable `
            --flutter `
            --skip-portable-pack `
            --hwcodec `
            --vram

          Move-Item `
            ".\flutter\build\windows\x64\runner\Release" `
            ".\rustdesk"

          Move-Item `
            ".\rustdesk\rustdesk.exe" `
            ".\rustdesk\SavolDesk.exe"


      # --------------------------------------------------------
      # Virtual display driver.
      #
      # RustDesk включает его в официальный Windows bundle.
      # --------------------------------------------------------

      - name: Add virtual display driver
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip" `
            -OutFile "usbmmidd_v2.zip"

          Expand-Archive `
            -Path "usbmmidd_v2.zip" `
            -DestinationPath "."

          Remove-Item `
            ".\usbmmidd_v2\Win32" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            ".\usbmmidd_v2\deviceinstaller64.exe", `
            ".\usbmmidd_v2\deviceinstaller.exe", `
            ".\usbmmidd_v2\usbmmidd.bat" `
            -Force `
            -ErrorAction SilentlyContinue

          Move-Item `
            ".\usbmmidd_v2" `
            ".\rustdesk\usbmmidd_v2"


      # --------------------------------------------------------
      # Restore TopMost Window helper.
      # --------------------------------------------------------

      - name: Restore TopMost helper
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: savol-topmostwindow-x64
          path: ./rustdesk


      # --------------------------------------------------------
      # Runner.res нужен portable packer.
      # --------------------------------------------------------

      - name: Find Runner.res
        shell: bash
        run: |
          set -e

          runner_res="$(find . -name "Runner.res" | head -n 1)"

          if [[ -z "${runner_res}" ]]; then
            echo "Runner.res not found."
            exit 1
          fi

          echo "Runner.res found:"
          echo "${runner_res}"

          cp \
            "${runner_res}" \
            ./libs/portable/Runner.res


      # --------------------------------------------------------
      # Сохраняем raw build только по явному запросу.
      #
      # Это полезно для диагностики, если portable packer
      # когда-нибудь сломается, но обычно добавляет сотни МБ
      # к времени создания и выгрузки artifact.
      # --------------------------------------------------------

      - name: Prepare raw build
        if: ${{ inputs.include_raw_build }}
        shell: powershell
        run: |
          New-Item `
            -ItemType Directory `
            -Path ".\dist\raw" `
            -Force |
            Out-Null

          Copy-Item `
            ".\rustdesk\*" `
            ".\dist\raw\" `
            -Recurse `
            -Force


      # --------------------------------------------------------
      # Кэш Python packages portable packer. Его ключ привязан
      # к requirements.txt, поэтому смена зависимостей не может
      # восстановить устаревший набор пакетов.
      # --------------------------------------------------------

      - name: Cache portable packer Python packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ./.pip-cache
          key: savoldesk-portable-pip-${{ runner.os }}-${{ hashFiles('libs/portable/requirements.txt') }}


      # --------------------------------------------------------
      # Создаём один self-contained EXE.
      #
      # Получится:
      #
      # SavolDesk-1.4.9-x86_64.exe
      # --------------------------------------------------------

      - name: Build self-extracted executable
        shell: bash
        run: |
          set -e

          # Как в официальной сборке RustDesk.
          sed -i '/dpiAware/d' res/manifest.xml

          pushd ./libs/portable

          pip3 install \
            --cache-dir ../../.pip-cache \
            -r requirements.txt

          python3 \
            ./generate.py \
            -f ../../rustdesk/ \
            -o . \
            -e ../../rustdesk/SavolDesk.exe

          popd

          mkdir -p ./dist

          mv \
            ./target/release/rustdesk-portable-packer.exe \
            ./dist/SavolDesk-1.4.9-x86_64.exe


      # --------------------------------------------------------
      # Показываем итог.
      # --------------------------------------------------------

      - name: Show build output
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================"
          Write-Host " SAVOLDESK BUILD COMPLETE"
          Write-Host "============================================"
          Write-Host ""

          Get-ChildItem `
            ".\dist" `
            -Recurse |
            Select-Object `
              FullName, `
              Length


      # --------------------------------------------------------
      # Основной GitHub Artifact: только готовый установщик.
      #
      # Это заметно быстрее, чем передавать raw bundle при
      # каждой штатной сборке.
      # --------------------------------------------------------

      - name: Upload SavolDesk Windows x64
