name: Savol RustDesk Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"

  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"

  # Нужен GitHub Actions cache для vcpkg.
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  # ------------------------------------------------------------
  # Flutter/Rust bridge
  # ------------------------------------------------------------

  generate-bridge:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.75"
          components: rustfmt

      - name: Install Flutter 3.22.3 for bridge
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.22.3"
          cache: true

      - name: Install bridge generator
        shell: bash
        run: |
          cargo install cargo-expand \
            --version 1.0.95 \
            --locked

          cargo install flutter_rust_bridge_codegen \
            --version 1.80.1 \
            --features uuid \
            --locked

      - name: Generate bridge
        shell: bash
        run: |
          # RustDesk 1.4.9 использует такой downgrade
          # для bridge на Flutter 3.22.3.
          sed -i \
            's/extended_text: 14.0.0/extended_text: 13.0.0/g' \
            flutter/pubspec.yaml

          pushd flutter
          flutter pub get
          popd

          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h

          cp \
            ./flutter/macos/Runner/bridge_generated.h \
            ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h


  # ------------------------------------------------------------
  # RustDeskTempTopMostWindow x64
  # ------------------------------------------------------------

  build-topmost-x64:
    runs-on: windows-2022

    steps:
      - name: Add MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce

      - name: Clone helper
        shell: powershell
        run: |
          git clone `
            https://github.com/rustdesk-org/RustDeskTempTopMostWindow `
            RustDeskTempTopMostWindow

      - name: Build helper
        shell: powershell
        run: |
          cd RustDeskTempTopMostWindow

          git checkout `
            ecd8d6a139eee76845ea66423fb739af450fda90

          msbuild `
            WindowInjection/WindowInjection.vcxproj `
            -p:Configuration=Release `
            -p:Platform=x64 `
            /p:TargetVersion=Windows10

      - name: Upload helper
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: topmostwindow-artifacts-x64
          path: |
            RustDeskTempTopMostWindow/WindowInjection/x64/Release/WindowInjection.dll


  # ------------------------------------------------------------
  # RustDesk Windows x64
  # ------------------------------------------------------------

  build-windows-x64:
    needs:
      - generate-bridge
      - build-topmost-x64

    runs-on: windows-2022

    steps:
      - name: Export GitHub cache environment
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        with:
          script: |
            core.exportVariable(
              'ACTIONS_CACHE_URL',
              process.env.ACTIONS_CACHE_URL || ''
            );

            core.exportVariable(
              'ACTIONS_RUNTIME_TOKEN',
              process.env.ACTIONS_RUNTIME_TOKEN || ''
            );

      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Restore bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace Flutter engine
        shell: powershell
        run: |
          flutter doctor -v
          flutter precache --windows

          Invoke-WebRequest `
            -Uri "https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip" `
            -OutFile "windows-x64-release.zip"

          Expand-Archive `
            -Path "windows-x64-release.zip" `
            -DestinationPath "windows-x64-release"

          Copy-Item `
            -Path "windows-x64-release\*" `
            -Destination "C:\hostedtoolcache\windows\flutter\stable-${{ env.FLUTTER_VERSION }}-x64\bin\cache\artifacts\engine\windows-x64-release\" `
            -Recurse `
            -Force

      - name: Patch Flutter
        shell: bash
        run: |
          cp \
            .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff \
            $(dirname $(dirname $(which flutter)))

          cd $(dirname $(dirname $(which flutter)))

          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"

      - name: Build RustDesk x64
        shell: powershell
        run: |
          python3 `
            .\build.py `
            --portable `
            --flutter `
            --skip-portable-pack `
            --hwcodec `
            --vram

          Move-Item `
            ".\flutter\build\windows\x64\runner\Release" `
            ".\rustdesk"

      - name: Download usbmmidd
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip" `
            -OutFile "usbmmidd_v2.zip"

          Expand-Archive `
            "usbmmidd_v2.zip" `
            -DestinationPath "."

          Remove-Item `
            ".\usbmmidd_v2\Win32" `
            -Recurse `
            -Force

          Remove-Item `
            ".\usbmmidd_v2\deviceinstaller64.exe", `
            ".\usbmmidd_v2\deviceinstaller.exe", `
            ".\usbmmidd_v2\usbmmidd.bat" `
            -ErrorAction SilentlyContinue

          Move-Item `
            ".\usbmmidd_v2" `
            ".\rustdesk\usbmmidd_v2"

      - name: Restore TopMost helper
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: topmostwindow-artifacts-x64
          path: ./rustdesk

      - name: Upload RustDesk Windows x64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Savol-RustDesk-Windows-x64
          path: ./rustdesk
